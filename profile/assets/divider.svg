<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 8" width="1000" height="8" role="presentation">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect y="2" width="1000" height="4" rx="2" fill="url(#base)"/>
  <rect y="2" width="240" height="4" rx="2" fill="url(#spark)">
    <animate attributeName="x" from="-240" to="1000" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
